server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Keep redirects relative, so they stay on whichever host the visitor used
    # (theedenapis.com through the main site's proxy, or the handbooks host directly).
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location = / {
        return 302 /staff-handbooks/;
    }

    location = /staff-handbooks {
        return 301 /staff-handbooks/;
    }

    # Hashed build assets never change.
    location /staff-handbooks/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /staff-handbooks/ {
        index index.html;
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    error_page 404 /staff-handbooks/404.html;
}
